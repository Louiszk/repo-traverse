volumes:
  graph_data:

x-service-base: &service-base
  image: ${BACKEND_IMAGE:-repotraverse-backend:1.0.0}
  build:
    context: .
    dockerfile: ./backend/Dockerfile
  env_file:
    - .env.shared
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    pull_policy: if_not_present
    command: redis-server --requirepass ${REDIS_PASSWORD:?Variable REDIS_PASSWORD is required.}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Variable REDIS_PASSWORD is required.}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - worker_backend

  backend:
    <<: *service-base
    env_file:
      - .env.shared
      - .env.backend
    environment:
      SERVICE_ROLE: api
      REDIS_URL: redis://:${REDIS_PASSWORD:?Variable REDIS_PASSWORD is required.}@redis:6379/0
      CELERY_REDIS_URL: redis://:${REDIS_PASSWORD:?Variable REDIS_PASSWORD is required.}@redis:6379/1
    volumes:
      - graph_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - public_api
      - worker_backend

  worker:
    <<: *service-base
    command: celery -A app.celery_app:celery_app worker --loglevel=info --concurrency=1
    environment:
      SERVICE_ROLE: worker
      REDIS_URL: redis://:${REDIS_PASSWORD:?Variable REDIS_PASSWORD is required.}@redis:6379/0
      CELERY_REDIS_URL: redis://:${REDIS_PASSWORD:?Variable REDIS_PASSWORD is required.}@redis:6379/1
    volumes:
      - graph_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-1.5}"
          memory: "${WORKER_MEMORY_LIMIT:-2G}"
          pids: 100
    read_only: true
    tmpfs:
      - /tmp:size=1G,uid=1000,gid=1000,mode=1777
      - /app/data/scratch:size=${WORKER_SCRATCH_SIZE:-750M},uid=1000,gid=1000,mode=0700
    networks:
      - worker_backend

  beat:
    <<: *service-base
    command: celery -A app.celery_app:celery_app beat --loglevel=info
    environment:
      SERVICE_ROLE: beat
      REDIS_URL: redis://:${REDIS_PASSWORD:?Variable REDIS_PASSWORD is required.}@redis:6379/0
      CELERY_REDIS_URL: redis://:${REDIS_PASSWORD:?Variable REDIS_PASSWORD is required.}@redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - worker_backend

  frontend:
    image: ${FRONTEND_IMAGE:-repotraverse-frontend:1.0.0}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        - VITE_MAX_MESSAGES_PER_SESSION=${MAX_MESSAGES_PER_SESSION:-8}
        - VITE_MAX_CHAT_MESSAGE_LENGTH=${MAX_CHAT_MESSAGE_LENGTH:-1000}
    env_file:
      - .env.frontend
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - public_api

  nginx:
    image: nginxinc/nginx-unprivileged:1.26-alpine
    pull_policy: if_not_present
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=50M
    restart: unless-stopped
    networks:
      - public_api

networks:
  public_api:
  worker_backend:
